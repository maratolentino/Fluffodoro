<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fluffodoro - Plan Tasks</title>
    <!-- Browser Tab Logo -->
    <link rel="icon" type="image/png" href="assets/images/LOGO.png">

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">

    <!-- Custom Styles -->
    <link rel="stylesheet" href="style.css">
</head>

<body class="fluffodoro-bg d-flex align-items-center">

    <!-- Music Container  -->
    <div class="music-menu-container">
        <div class="music-menu-bar">
            <button class="btn btn-pixel btn-pixel-sm" id="musicToggleBtn" title="Toggle Music Menu">
                🎵 <span class="d-none d-sm-inline" id="musicStatusText">MUSIC: OFF</span>
            </button>
        </div>

        <!-- Music Dropdown -->
        <div class="pixel-music-panel d-none" id="musicPanel">
            <div class="panel-header mb-2 fw-bold text-center">SELECT TRACK</div>

            <!-- Songs -->
            <div class="song-list mb-3">
                <button class="btn btn-pixel-song active w-100 mb-1" data-src="assets/audio/lofi-bg.mp3">
                    ▶ 1. Cozy Focus
                </button>
                <button class="btn btn-pixel-song w-100 mb-1" data-src="assets/audio/rainy-day.mp3">
                    ▶ 2. Soft Rain
                </button>
                <button class="btn btn-pixel-song w-100" data-src="assets/audio/cafe-vibes.mp3">
                    ▶ 3. Lofi Cafe
                </button>
            </div>

            <!-- Volume Slider -->
            <div class="volume-control">
                <label for="volumeSlider" class="form-label mb-1">VOLUME</label>
                <input type="range" class="form-range pixel-slider" id="volumeSlider" min="0" max="1" step="0.05"
                    value="0.5">
            </div>
        </div>
    </div>

    <!-- Top Logo -->
    <div class="top-logo">
        <a href="index.html" class="d-flex align-items-center text-decoration-none">
            <img src="assets/images/LOGO.png" class="top-logo-img" alt="Fluffodoro Mini Logo">
            <span class="top-logo-text ms-2 d-none d-sm-inline">FLUFFODORO</span>
        </a>
    </div>

    <!-- Main Container -->
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-11 col-md-10 col-lg-8 text-center">

                <!-- Plan Your Task Card -->
                <div class="card fluffodoro-card p-4 p-md-5">

                    <!-- Background Floating Clouds -->
                    <img src="assets/images/CLOUD.png" class="floating-cloud cloud-plan-left1" alt="Pixel Cloud">
                    <img src="assets/images/CLOUD.png" class="floating-cloud cloud-plan-left2" alt="Pixel Cloud">
                    <img src="assets/images/CLOUD.png" class="floating-cloud cloud-plan-right1" alt="Pixel Cloud">
                    <img src="assets/images/CLOUD.png" class="floating-cloud cloud-plan-right2" alt="Pixel Cloud">

                    <h1 class="mb-4 pixel-font-plan text-uppercase">Plan Your Task</h1>
                    <p class="pixel-subtitle mb-4">Choose a mode below to add to your list </p>

                    <div class="d-flex flex-wrap justify-content-center gap-3 mb-4">
                        <button class="btn btn-pixel task-mode-btn" data-mode="Focus">
                            + FOCUS
                        </button>
                        <button class="btn btn-pixel task-mode-btn" data-mode="Short Break">
                            + SHORT BREAK
                        </button>
                        <button class="btn btn-pixel task-mode-btn" data-mode="Long Break">
                            + LONG BREAK
                        </button>
                    </div>

                    <!-- Dynamic Task List Container -->
                    <div class="task-list-container text-start d-none" id="taskListContainer">
                        <div class="task-list-header mb-2 fw-bold">YOUR TASKS:</div>
                        <ul class="pixel-task-list list-unstyled mb-3" id="taskList"></ul>

                        <!-- Start Button -->
                        <div class="text-center mt-4">
                            <button class="btn btn-pixel btn-start-task" id="startTaskBtn">
                                ▶ START TASK
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Footer -->
                <div class="footer-text mt-4 pixel-font text-uppercase">
                    <p class="pixel-footer mb-0">MADE BY HANNA <span class="pixel-heart">♥</span></p>
                </div>

            </div>
        </div>
    </div>

    <!-- Pop-up Modal -->
    <div class="pixel-modal-backdrop d-none" id="taskModal">
        <div class="pixel-modal-content p-4">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h2 class="pixel-modal-title mb-0" id="modalTitle">+ ADD TASK</h2>
                <button class="btn-pixel-close" id="closeModalBtn" type="button">×</button>
            </div>

            <!-- Name Input  -->
            <div class="mb-3 text-start" id="taskNameGroup">
                <label for="taskInput" class="form-label pixel-label">TASK NAME</label>
                <input type="text" class="form-control pixel-input" id="taskInput" placeholder="What are we working on?"
                    autocomplete="off">
            </div>

            <!-- Time Input -->
            <div class="mb-3 text-start">
                <label for="timeInput" class="form-label pixel-label" id="timeLabel">TIME (MINUTES)</label>
                <input type="number" class="form-control pixel-input" id="timeInput" value="25" min="1" max="180">
                <p class="pixel-hint mt-2 mb-0" id="timeHint">25 minutes is the recommended allotted time.</p>
            </div>

            <div class="d-flex justify-content-end gap-2 mt-4">
                <button class="btn btn-pixel btn-pixel-sm" id="cancelModalBtn" type="button">CANCEL</button>
                <button class="btn btn-pixel btn-pixel-sm active" id="saveTaskBtn" type="button">ADD TASK</button>
            </div>
        </div>
    </div>

    <!-- Popup Notification -->
    <div class="pixel-toast d-none" id="startToast">
        <span class="toast-star">✧</span> STARTING YOUR TASK...
    </div>

  
    <script>
        // Task Planning & Modal Script
        const taskModal = document.getElementById('taskModal');
        const modalTitle = document.getElementById('modalTitle');
        const taskModeBtns = document.querySelectorAll('.task-mode-btn');
        const closeModalBtn = document.getElementById('closeModalBtn');
        const cancelModalBtn = document.getElementById('cancelModalBtn');
        const saveTaskBtn = document.getElementById('saveTaskBtn');

        const taskNameGroup = document.getElementById('taskNameGroup');
        const taskInput = document.getElementById('taskInput');
        const timeInput = document.getElementById('timeInput');
        const timeLabel = document.getElementById('timeLabel');
        const timeHint = document.getElementById('timeHint');

        const taskListContainer = document.getElementById('taskListContainer');
        const taskList = document.getElementById('taskList');
        const startTaskBtn = document.getElementById('startTaskBtn');
        const startToast = document.getElementById('startToast');

        let currentSelectedMode = 'Focus';

        taskModeBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                currentSelectedMode = btn.getAttribute('data-mode');
                modalTitle.textContent = `+ ${currentSelectedMode.toUpperCase()}`;
                taskInput.value = '';

                if (currentSelectedMode === 'Focus') {
                    taskNameGroup.classList.remove('d-none');
                    timeLabel.textContent = 'FOCUS TIME (MINUTES)';
                    timeInput.value = 25;
                    timeHint.textContent = '25 minutes is the recommended allotted time.';
                    setTimeout(() => taskInput.focus(), 50);
                } else if (currentSelectedMode === 'Short Break') {
                    taskNameGroup.classList.add('d-none');
                    timeLabel.textContent = 'BREAK TIME (MINUTES)';
                    timeInput.value = 5;
                    timeHint.textContent = '5 minutes is the recommended allotted time.';
                    setTimeout(() => timeInput.focus(), 50);
                } else if (currentSelectedMode === 'Long Break') {
                    taskNameGroup.classList.add('d-none');
                    timeLabel.textContent = 'BREAK TIME (MINUTES)';
                    timeInput.value = 15;
                    timeHint.textContent = '15 minutes is the recommended allotted time.';
                    setTimeout(() => timeInput.focus(), 50);
                }

                taskModal.classList.remove('d-none');
            });
        });

        const closeModal = () => taskModal.classList.add('d-none');

        closeModalBtn.addEventListener('click', closeModal);
        cancelModalBtn.addEventListener('click', closeModal);

        taskModal.addEventListener('click', (e) => {
            if (e.target === taskModal) closeModal();
        });

        // Add Task
        saveTaskBtn.addEventListener('click', () => {
            const taskName = taskInput.value.trim();
            const taskTime = parseInt(timeInput.value) || (currentSelectedMode === 'Focus' ? 25 : (currentSelectedMode === 'Short Break' ? 5 : 15));

            if (currentSelectedMode !== 'Focus' || taskName !== '') {
                taskListContainer.classList.remove('d-none');

                const displayName = currentSelectedMode === 'Focus' ? taskName : currentSelectedMode;

                const li = document.createElement('li');
                li.className = 'pixel-task-item d-flex align-items-center justify-content-between p-2 mb-2';
                li.setAttribute('data-name', displayName);
                li.setAttribute('data-mode', currentSelectedMode);
                li.setAttribute('data-time', taskTime);

                li.innerHTML = `
                    <div class="d-flex align-items-center gap-2 overflow-hidden me-2">
                        <span class="pixel-bullet flex-shrink-0">✦</span>
                        <span class="task-mode-badge flex-shrink-0">${currentSelectedMode}</span>
                        <span class="task-time-badge flex-shrink-0">⏱ ${taskTime}m</span>
                        <span class="task-text text-truncate">${displayName}</span>
                    </div>
                    <button class="btn-pixel-delete flex-shrink-0" title="Delete Task" type="button">×</button>
                `;

                li.querySelector('.btn-pixel-delete').addEventListener('click', () => {
                    li.remove();
                    if (taskList.children.length === 0) {
                        taskListContainer.classList.add('d-none');
                    }
                });

                taskList.appendChild(li);
                closeModal();
            }
        });

        // Save Tasks to localStorage and Redirect
        startTaskBtn.addEventListener('click', () => {
            const taskItems = document.querySelectorAll('.pixel-task-item');

            if (taskItems.length === 0) {
                alert("Please add at least one task before starting!");
                return;
            }

            const tasksQueue = [];
            taskItems.forEach(item => {
                tasksQueue.push({
                    name: item.getAttribute('data-name'),
                    mode: item.getAttribute('data-mode'),
                    time: parseInt(item.getAttribute('data-time'))
                });
            });

            localStorage.setItem('fluffodoro_tasks', JSON.stringify(tasksQueue));

            startToast.classList.remove('d-none');

            setTimeout(() => {
                window.location.href = 'timer.html';
            }, 2000);
        });

        [taskInput, timeInput].forEach(input => {
            input.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    saveTaskBtn.click();
                }
            });
        });
    </script>

    <!-- Background Music Sync Controller -->
    <script src="audio-sync.js"></script>

</body>

</html>
